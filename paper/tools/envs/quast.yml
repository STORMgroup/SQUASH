# paper/tools/envs/quast.yml: QUAST 5.2.0 (`quast.py --version`), the bioconda build the paper's evaluation used, with the
# minimap2 build it aligned with (2.28) and setuptools below 70 (QUAST 5.2.0 imports pkg_resources).
#   tools/conda.sh quast
name: quast
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - quast=5.2.0=py312pl5321hc60241a_4
  - python=3.12.3
  - minimap2=2.28=he4a0461_3
  - setuptools=69.5.1
