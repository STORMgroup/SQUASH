# paper/tools/envs/build.yml: the compilers of the two source builds (RawHash2 at commit 92366af, metaMDBG 1.2): GCC 15.1.0
# (the paper's builds used GCC 15.1.0), CMake, make, zlib, git.
#   tools/conda.sh build
name: build
channels:
  - conda-forge
  - nodefaults
dependencies:
  - gcc=15.1.0
  - gxx=15.1.0
  - cmake=3.31.8
  - make
  - zlib=1.3.1
  - git
