name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - name: build
        run: make build
      - name: tests
        run: make test
      - name: every option is documented
        run: |
          for o in $(./target/release/squash --help | grep -oE -- '--[a-z][a-z0-9-]+' | sort -u); do
            grep -q -- "$o" docs/USAGE.md || { echo "docs/USAGE.md lacks $o"; exit 1; }
          done
